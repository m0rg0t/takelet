name: macOS checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and unit tests
        run: sh scripts/swift-check.sh test
      - name: Build developer app
        run: sh scripts/build-app.sh
      - name: Check release packaging and optimized build
        env:
          TAKELET_BUILD_CONFIGURATION: release
        run: |
          bash -n scripts/build-dmg.sh
          plutil -lint Resources/Takelet.entitlements
          sh scripts/build-app.sh
      - name: Check public files
        run: python3 scripts/check-public-files.py


  annotations:
    name: Synthetic annotation exports
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TAKELET_BUILD_CACHE: ${{ runner.temp }}/takelet-annotations-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare synthetic audio dependency
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version
          swift --version
      - name: Build native media validator
        run: sh scripts/swift-check.sh build --product takelet-media-check
      - name: Validate synthetic annotation exports
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/takelet-annotation-diagnostics"
          mkdir -p "$diagnostics"
          output="$diagnostics/media"
          "$TAKELET_BUILD_CACHE/build/debug/takelet-media-check" --annotations "$output" 2>&1 | tee "$diagnostics/media-check.log"
          python3 scripts/check-annotation-report.py "$output/validation.json"
          cat "$output/validation.json"
          shasum -a 256 "$output/validation.json" > "$diagnostics/report.sha256"
          if "$TAKELET_BUILD_CACHE/build/debug/takelet-media-check" --annotations "$output" > "$diagnostics/existing-output.log" 2>&1; then
            echo "Existing output directory was unexpectedly accepted" >&2
            exit 1
          fi
          grep -F "Choose a new output directory." "$diagnostics/existing-output.log"
          shasum -a 256 -c "$diagnostics/report.sha256"
      - name: Retain synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: annotation-validation-${{ github.sha }}
          path: ${{ runner.temp }}/takelet-annotation-diagnostics/
          if-no-files-found: warn
          retention-days: 7
